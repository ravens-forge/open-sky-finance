targets:
  $default:
    builders:
      drift_dev:
        options:
          # Transaction dates are local wall-clock times stored as ISO-8601 text.
          # Changing this later needs a data migration.
          store_date_time_values_as_text: true
          # Queries go through DAOs; the manager API is not used.
          generate_manager: false
          # Schema history and migration tests: `dart run drift_dev make-migrations`
          # after every schemaVersion bump.
          databases:
            app_database: lib/data/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
