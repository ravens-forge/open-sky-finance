name: open_sky_finance
description: "Free, offline-first personal finance app with no limits, no ads and no accounts."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# No package here may access the network, collect telemetry or show ads (see AGENTS.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State and navigation
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1

  # Local database (SQLite)
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  intl: ^0.20.3
  uuid: ^4.6.0
  fl_chart: ^1.2.0
  file_picker: ^13.1.0
  sqlite3: ^3.6.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  decimal: ^3.2.6
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation: Drift tables/DAOs and Riverpod providers
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9

  # Generate launcher icons and native splash from assets/branding/launcher/
  # (dart run flutter_launcher_icons && dart run flutter_native_splash:create)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Localizations are generated from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/launcher/icon.png
  adaptive_icon_background: "#FAF7F0"
  adaptive_icon_foreground: assets/branding/launcher/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/launcher/icon_monochrome.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAF7F0"
  image: assets/branding/launcher/splash_light.png
  color_dark: "#16130F"
  image_dark: assets/branding/launcher/splash_dark.png
  android_12:
    color: "#FAF7F0"
    image: assets/branding/launcher/splash_android12_light.png
    color_dark: "#16130F"
    image_dark: assets/branding/launcher/splash_android12_dark.png
  web: false
