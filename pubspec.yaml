name: open_sky_finance
description: "Free, offline-first personal finance app with no limits, no ads and no accounts."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# No package here may access the network, collect telemetry or show ads (see AGENTS.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State and navigation
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1

  # Local database (SQLite)
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  intl: ^0.20.3
  uuid: ^4.6.0
  fl_chart: ^1.2.0
  file_picker: ^13.1.0
  sqlite3: ^3.6.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  decimal: ^3.2.6
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation: Drift tables/DAOs and Riverpod providers
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  # Localizations are generated from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  assets:
    - assets/branding/
