name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the Flutter version pinned in .fvmrc
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm.outputs.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      # Generated code is not committed (see AGENTS.md)
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      # gen-l10n writes every key missing from app_es.arb / app_fr.arb here
      - name: Check translations are complete
        run: |
          if [ -f l10n_untranslated.txt ] && [ "$(tr -d '[:space:]' < l10n_untranslated.txt)" != "{}" ]; then
            echo "::error file=l10n_untranslated.txt::Missing translations:"
            cat l10n_untranslated.txt
            exit 1
          fi

      # UI text goes through context.l10n. Symbols ('−', '⇄'), interpolations and
      # lines ending in `// l10n-ignore` (debug-only widgets) are allowed.
      - name: Check for hard-coded Text strings
        env:
          LC_ALL: C.UTF-8
        run: |
          [ -d lib/features ] || exit 0
          # Without pipefail the `if` sees tr's status (always 0), not grep's.
          set -o pipefail
          if grep -rHoPz --include='*.dart' \
            "\bText\(\s*r?(['\"])(?:\\$\{[^}'\"]*\}|\\$\w+|[^'\"\n\p{L}\\$])*\p{L}[^'\"\n]*\1(?![^\n]*// l10n-ignore)" \
            lib/features | tr '\0' '\n'; then
            echo "::error::Hard-coded strings in Text(...). Add them to the ARB files and use context.l10n."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  no-internet-permission:
    name: No INTERNET permission in release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm.outputs.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      # Plugins can add permissions, so check the manifest Gradle merges for release,
      # not only android/app/src/main/AndroidManifest.xml.
      - name: Merge the release manifest
        run: |
          flutter build apk --config-only --release
          cd android && ./gradlew :app:processReleaseManifest --no-daemon -q

      - name: Check merged release manifest
        run: |
          manifest=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if [ ! -f "$manifest" ]; then
            echo "::error::Merged release manifest not found at $manifest (Android Gradle Plugin layout changed?)."
            exit 1
          fi
          # Allowlist: any other permission (INTERNET, storage, location, contacts, SMS,
          # phone…) fails. Add POST_NOTIFICATIONS here only when local reminders ship.
          allowed='\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$'
          unexpected=$(grep -o 'uses-permission[^>]*android:name="[^"]*"' "$manifest" \
            | sed 's/.*android:name="\([^"]*\)"/\1/' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The merged release manifest requests unexpected permissions:"
            echo "$unexpected"
            exit 1
          fi
          echo "OK: no unexpected permissions in the merged release manifest."
