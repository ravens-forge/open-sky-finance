arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
nullable-getter: false
# Every key in the template needs an @key entry with a description for translators.
required-resource-attributes: true
# Fail the build when a translation is missing instead of falling back silently.
untranslated-messages-file: l10n_untranslated.txt
